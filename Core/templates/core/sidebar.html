{% load static %}

<nav class="sidebar sidebar-offcanvas" id="sidebar">
    <ul class="nav">
        <!-- Dashboard -->
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'inventory:dashboard' %}">
                <i class="mdi mdi-grid-large menu-icon"></i>
                <span class="menu-title">Dashboard</span>
            </a>
        </li>

        <li class="nav-item nav-category">Inventory Management</li>

        <!-- Product Catalog -->
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'product-list' %}active{% endif %}" href="{% url 'inventory:product-list' %}">
                <i class="menu-icon mdi mdi-package-variant-closed"></i>
                <span class="menu-title">Product Catalog</span>
            </a>
        </li>

        <!-- Store Checkout / POS -->
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'checkout' %}active{% endif %}" href="{% url 'inventory:checkout' %}">
                <i class="menu-icon mdi mdi-cart-arrow-right"></i>
                <span class="menu-title">Store Checkout (POS)</span>
            </a>
        </li>

        {% if request.user.role == 'ADMIN' or request.user.role == 'MANAGER' or request.user.is_superuser %}
        <!-- Stock Transfer Engine -->
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'transfer' %}active{% endif %}" href="{% url 'inventory:transfer' %}">
                <i class="menu-icon mdi mdi-swap-horizontal-bold"></i>
                <span class="menu-title">Atomic Transfer</span>
            </a>
        </li>

        <!-- Stock Intake -->
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'intake' %}active{% endif %}" href="{% url 'inventory:intake' %}">
                <i class="menu-icon mdi mdi-arrow-down-bold-box"></i>
                <span class="menu-title">Stock Intake</span>
            </a>
        </li>

        <!-- Stock Audit / Manual Check -->
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'stock-adjust' %}active{% endif %}" href="{% url 'inventory:stock-adjust' %}">
                <i class="menu-icon mdi mdi-clipboard-check"></i>
                <span class="menu-title">Stock Audit</span>
            </a>
        </li>

        <!-- Audit Telemetry Logs -->
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'logs' %}active{% endif %}" href="{% url 'inventory:logs' %}">
                <i class="menu-icon mdi mdi-history"></i>
                <span class="menu-title">Audit Logs</span>
            </a>
        </li>
        {% endif %}
    </ul>
</nav>
