name: inventory_management
description: "A mobile-first Flutter inventory management app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.3.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  http_parser: ^4.0.2
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
